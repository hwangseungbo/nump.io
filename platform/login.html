<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Basil Nexus · 로그인</title>
<link rel="icon" href="../assets/favicon.ico" sizes="any" />
<meta name="theme-color" content="#2f9e57" />
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css');
  :root{ --accent:#2f9e57; --accent-d:#1f8a4c; --accent-dd:#176b3a; --ink:#1f2d27; --muted:#7f8e85; --line:#e6ece6; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ font-family:'Pretendard','Apple SD Gothic Neo',sans-serif; min-height:100vh;
    display:flex; align-items:center; justify-content:center; padding:20px;
    background:linear-gradient(160deg,#eef4ec 0%, #e3efe6 55%, #d9eadf 100%); color:var(--ink); }
  .card{ width:100%; max-width:400px; background:#fff; border:1px solid var(--line);
    border-radius:22px; box-shadow:0 20px 60px rgba(40,80,55,.12); padding:36px 34px 30px; }
  .brand{ display:flex; align-items:center; gap:11px; justify-content:center; margin-bottom:6px; }
  .brand img{ height:44px; }
  .brand .bt{ font-size:21px; font-weight:800; letter-spacing:-.3px; }
  .sub{ text-align:center; font-size:12.5px; color:var(--muted); margin-bottom:26px; }
  label{ display:block; font-size:12.5px; font-weight:700; color:var(--ink); margin:14px 0 6px; }
  input{ width:100%; border:1px solid var(--line); border-radius:12px; padding:12px 14px;
    font-family:inherit; font-size:14px; outline:none; transition:border .15s; background:#fafcfa; }
  input:focus{ border-color:var(--accent); background:#fff; }
  .btn{ width:100%; margin-top:22px; background:linear-gradient(135deg,#4aab61,#2f8347); color:#fff;
    border:none; border-radius:12px; padding:13px; font-family:inherit; font-size:14.5px; font-weight:700;
    cursor:pointer; box-shadow:0 8px 20px rgba(47,131,71,.28); }
  .btn:disabled{ opacity:.6; cursor:default; }
  .err{ display:none; margin-top:14px; background:#fdeaea; border:1px solid #f5c2c2; color:#c0392b;
    font-size:12.5px; padding:10px 13px; border-radius:10px; }
  .foot{ margin-top:22px; text-align:center; font-size:12px; color:var(--muted); }
  .foot a{ color:var(--accent-d); text-decoration:none; font-weight:600; }
  .secure{ display:flex; align-items:center; justify-content:center; gap:6px; margin-top:14px;
    font-size:11.5px; color:var(--muted); }
  .secure svg{ width:14px; height:14px; stroke:var(--accent-d); fill:none; stroke-width:1.8; }
</style>
</head>
<body>
<form class="card" id="loginForm" autocomplete="on">
  <div class="brand">
    <img src="../assets/logo-mark.png" alt="" />
    <span class="bt">Basil Nexus</span>
  </div>
  <div class="sub">AI 통합 의료 플랫폼 · 통합 대시보드 로그인</div>

  <label for="u">아이디</label>
  <input id="u" name="username" type="text" placeholder="아이디를 입력하세요" required autofocus autocomplete="username" />
  <label for="p">비밀번호</label>
  <input id="p" name="password" type="password" placeholder="비밀번호를 입력하세요" required autocomplete="current-password" />

  <div class="err" id="err"></div>
  <button class="btn" id="btn" type="submit">로그인</button>

  <div class="foot">처음이신가요? <a href="signup.html">환자 회원가입</a> · <a href="../index.html">메인으로</a></div>
  <div class="secure">
    <svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>
    On-Premise 보안 연결 · 데이터는 원내에만 저장됩니다
  </div>
</form>
<script>
(function(){
  var ROLE_HOME = { doctor:'doctor/index.html', nurse:'nurse/index.html', patient:'patient/index.html', admin:'admin/index.html' };
  var form = document.getElementById('loginForm');
  var err = document.getElementById('err');
  var btn = document.getElementById('btn');

  // 이미 로그인돼 있으면 바로 자기 페이지로
  fetch('/api/me').then(function(r){ return r.ok ? r.json() : null; }).then(function(me){
    if (me && ROLE_HOME[me.role]) location.href = ROLE_HOME[me.role];
  }).catch(function(){});

  form.addEventListener('submit', function(e){
    e.preventDefault();
    err.style.display = 'none';
    btn.disabled = true; btn.textContent = '확인 중…';
    fetch('/api/login', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ username: form.username.value.trim(), password: form.password.value })
    }).then(function(r){ return r.json().then(function(d){ return { ok:r.ok, d:d }; }); })
      .then(function(x){
        if (x.ok && ROLE_HOME[x.d.role]) { location.href = ROLE_HOME[x.d.role]; return; }
        err.textContent = (x.d && x.d.error) || '로그인에 실패했습니다.';
        err.style.display = 'block';
        btn.disabled = false; btn.textContent = '로그인';
      })
      .catch(function(){
        err.textContent = '서버에 연결할 수 없습니다.';
        err.style.display = 'block';
        btn.disabled = false; btn.textContent = '로그인';
      });
  });
})();
</script>
</body>
</html>
